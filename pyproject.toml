[project]
name = "synthsrch"
version = "0.1.0"
description = "Synthsrch — local search and knowledge synthesis. Learn without clutter."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20",
  "trafilatura>=1.10",
  "crawl4ai>=0.6",
  "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
synthsrch = "synthsrch.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
synthsrch = ["static/**"]
